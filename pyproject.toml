[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrai-guardrailgraph"
version = "0.8.0"
description = "Composable AI safety pipeline framework with industry compliance packs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Gaurav Kumar Sinha", email = "gaurav@substrai.dev" },
]
keywords = [
    "ai-safety",
    "guardrails",
    "llm",
    "compliance",
    "hipaa",
    "serverless",
    "aws-lambda",
    "dag",
    "pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.28.0"]
all = ["boto3>=1.28.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/substrai/guardrailgraph"
Documentation = "https://substrai.github.io/guardrailgraph"
Repository = "https://github.com/substrai/guardrailgraph"
Issues = "https://github.com/substrai/guardrailgraph/issues"

[project.scripts]
guardrailgraph = "guardrailgraph.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrailgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
